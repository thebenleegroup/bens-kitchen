<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; }
body {
  --bg:#0E1116; --panel:#161B22; --panel2:#1B222C; --line:#273140;
  --ink:#EEF3F8; --mut:#8A94A3; --lime:#C6F432; --cyan:#45D3E6;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-variant-numeric:tabular-nums;
  padding:0 14px calc(40px + env(safe-area-inset-bottom));
  max-width:760px; margin:0 auto; -webkit-text-size-adjust:100%;
}
.disp { font-family:'Anton',Impact,sans-serif; }
.top { padding:18px 2px 8px; }
.brand { display:flex; flex-direction:column; gap:2px; }
.wm { font-family:'Anton',Impact,sans-serif; font-size:clamp(42px,13vw,74px); line-height:0.92; letter-spacing:1px; color:var(--ink); margin:6px 0 0; }
.kick { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.kick-l { font-size:14px; font-weight:800; letter-spacing:4px; color:var(--lime); }
.pills { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0; }
.pill { font-size:13px; font-weight:700; letter-spacing:1px; padding:7px 15px; border-radius:999px; border:1.5px solid var(--line); color:var(--ink); }
.subrule { font-size:13px; color:var(--mut); margin:10px 0 0; }
.tagline { font-size:15px; color:#CFE0D6; line-height:1.4; margin:10px 0 2px; max-width:640px; }
.venue { font-size:12px; color:var(--mut); }
.live { display:flex; align-items:center; gap:7px; font-weight:700; font-size:15px;
  background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 12px; }
.live-dot { width:8px; height:8px; border-radius:50%; background:#5a6472; }
.live.on .live-dot { background:var(--lime); animation:pulse 2s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(198,244,50,.5);} 70%{box-shadow:0 0 0 7px rgba(198,244,50,0);} 100%{box-shadow:0 0 0 0 rgba(198,244,50,0);} }
.net { height:3px; border-radius:3px; margin:0 2px 4px; background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 24px); }
.tabs { display:flex; flex-wrap:wrap; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:5px; margin:14px 2px; }
.tab { flex:1 1 28%; white-space:nowrap; border:0; background:transparent; color:var(--mut); font-size:13px; font-weight:700; padding:9px 8px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; text-align:center; min-height:40px; }
.tab.on { background:var(--lime); color:#0E1116; }
.banner { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--cyan); border-radius:12px; padding:11px 14px; font-size:13px; color:var(--mut); margin:0 2px 12px; }
.view { display:flex; flex-direction:column; gap:14px; }
.champ { display:flex; align-items:center; gap:14px; background:linear-gradient(120deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-left:4px solid var(--lime); border-radius:16px; padding:16px; position:relative; }
.champ-crown { position:absolute; top:-10px; left:52px; font-size:22px; }
.champ-info { flex:1; min-width:0; }
.champ-lead { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--mut); }
.champ-name { font-family:'Anton',Impact,sans-serif; font-size:30px; line-height:1.05; }
.champ-sub { font-size:13px; color:var(--mut); margin-top:2px; }
.champ-w { text-align:center; line-height:1; }
.champ-w b { font-family:'Anton',Impact,sans-serif; font-size:40px; color:var(--lime); font-weight:400; }
.champ-w small { display:block; font-size:11px; color:var(--mut); letter-spacing:2px; }
.empty { text-align:center; padding:26px 16px; background:var(--panel); border:1px dashed var(--line); border-radius:16px; }
.empty .ball { font-size:34px; }
.empty p { margin:8px 0 0; font-weight:600; }
.empty .sub { font-weight:400; color:var(--mut); font-size:13px; max-width:320px; margin:6px auto 0; }
.board { background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.brow { display:grid; grid-template-columns:34px 1fr 36px 40px 40px 54px; align-items:center; padding:9px 14px; border-bottom:1px solid rgba(39,49,64,.5); }
.brow:last-child { border-bottom:0; }
.brow.head { font-size:11px; letter-spacing:.5px; color:var(--mut); }
.brow.head span { text-align:center; }
.brow.head .l { text-align:left; }
.brow.top { background:linear-gradient(90deg,rgba(198,244,50,.10),transparent 60%); }
.rk { font-weight:800; color:var(--mut); }
.brow.top .rk { color:var(--lime); }
.pl { display:flex; align-items:center; gap:11px; min-width:0; }
.pl .nm { display:flex; flex-direction:column; min-width:0; }
.pl .n1 { font-weight:700; font-size:16px; }
.pl .n2 { font-size:11px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.st { text-align:center; font-weight:700; }
.st.w { font-family:'Anton',Impact,sans-serif; font-size:22px; color:var(--lime); }
.st.pos { color:#7EE0A6; } .st.neg { color:#FF6B6B; }
.ava { display:inline-flex; align-items:center; justify-content:center; border-radius:50%; color:#0E1116; font-weight:800; flex:none; overflow:hidden; }
.ava.ph { border:2px solid; background:#20242e; }
.ava.ph img { width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }
.team { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
.avs { display:flex; }
.avs .ava { border:2px solid var(--panel); }
.avs .ava:nth-child(2){ margin-left:-8px; }
.tn { font-weight:700; font-size:15px; white-space:nowrap; }
.amp { color:var(--mut); }
.round-head { display:flex; align-items:center; gap:10px; margin:6px 2px 8px; }
.rnum { font-family:'Anton',Impact,sans-serif; font-size:20px; }
.rkind { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; }
.rkind.split { color:var(--lime); background:rgba(198,244,50,.12); }
.rkind.cross { color:var(--cyan); background:rgba(69,211,230,.12); }
.court { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 12px 8px; margin-bottom:10px; }
.court.done { border-color:rgba(198,244,50,.35); }
.ctop { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.ctag { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:800; }
.cdot { width:9px; height:9px; border-radius:50%; }
.cnote { font-size:11px; color:var(--mut); }
.cnote.fin { color:var(--lime); font-weight:800; letter-spacing:.5px; }
.trow { display:flex; align-items:center; gap:10px; padding:8px 6px; border-radius:10px; }
.trow.win { background:rgba(198,244,50,.09); }
.wt { font-weight:900; font-size:12px; color:#0E1116; background:var(--lime); border-radius:6px; padding:2px 7px; display:none; }
.trow.win .wt { display:inline-block; }
.step { display:flex; align-items:center; gap:2px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:3px; flex:none; }
.sb { width:42px; height:42px; border:0; background:transparent; color:var(--ink); font-size:24px; font-weight:700; cursor:pointer; border-radius:9px; }
.sb:active { background:var(--line); }
.snum { font-family:'Anton',Impact,sans-serif; font-size:26px; width:46px; min-width:46px; text-align:center; background:transparent; border:0; color:var(--ink); padding:4px 0; border-radius:8px; -webkit-appearance:none; appearance:none; -moz-appearance:textfield; }
.snum:focus { outline:0; background:var(--line); box-shadow:inset 0 0 0 2px var(--lime); }
.snum::-webkit-outer-spin-button,.snum::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.court.finale { border-color:#F4C542; box-shadow:0 0 0 1px rgba(244,197,66,.22), 0 8px 26px rgba(244,197,66,.14); background:linear-gradient(180deg,#1c1810,var(--panel)); }
.ctag.finale-tag { color:#F4C542; font-weight:800; }
.finale-sub { font-size:12px; color:#F4C542; font-weight:800; letter-spacing:.04em; margin:1px 0 9px; }
.finale-msg { font-size:13px; color:var(--mut); line-height:1.45; padding:8px 2px 4px; }
.upload { width:100%; border:0; border-radius:14px; background:var(--lime); color:#0E1116; font-family:'Anton',Impact,sans-serif; font-size:20px; letter-spacing:.02em; padding:16px; margin-top:4px; cursor:pointer; }
.upload:active { filter:brightness(.92); }
.upload.dim { background:var(--panel2); color:var(--mut); font-family:inherit; font-size:14px; font-weight:700; cursor:default; }
.uphint { font-size:12px; color:var(--mut); text-align:center; margin:8px 6px 2px; line-height:1.4; }
.past { padding:0; overflow:hidden; }
.photo { padding:0; overflow:hidden; }
.photo a { display:block; position:relative; background:var(--panel2); }
.photo .crown { position:absolute; transform:translate(-50%,-88%) rotate(-8deg); font-size:clamp(26px,9vw,44px); line-height:1; pointer-events:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
.photo img { display:block; width:100%; height:auto; aspect-ratio:3/4; object-fit:cover; }
.photo .pcap { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; }
.photo .ptag { font-size:11px; font-weight:800; color:#0E1116; background:var(--lime); border-radius:999px; padding:3px 9px; white-space:nowrap; }
.ptop { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 14px; cursor:pointer; }
.phd { font-size:15px; font-weight:800; color:var(--ink); }
.psub { font-size:12px; color:var(--mut); margin-top:2px; }
.pwin { font-size:13px; font-weight:700; color:#F4C542; display:flex; align-items:center; gap:6px; white-space:nowrap; }
.winwrap { display:inline-flex; align-items:center; gap:5px; }
.winsep { color:var(--mut); margin:0 1px; }
.pcar { color:var(--mut); font-size:10px; }
.pbody { border-top:1px solid var(--line); padding:10px 14px 14px; }
.pgames { display:flex; flex-direction:column; gap:7px; }
.pgrow { display:grid; grid-template-columns:20px 1fr auto 1fr; align-items:center; gap:8px; font-size:13px; }
.pg-n { color:var(--mut); font-size:11px; }
.pteam { color:var(--ink); }
.pteam.r { text-align:right; }
.pteam.win { color:var(--lime); font-weight:700; }
.pscore { font-family:'Anton',Impact,sans-serif; font-size:16px; color:var(--ink); }
.pdash { color:var(--mut); margin:0 4px; }
.pfin { margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; }
.pfin-h { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin-bottom:6px; }
.pnote { font-size:13px; color:var(--mut); font-style:italic; }
.pfin-r { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--ink); padding:4px 0; }
.pfin-r span:last-child { color:var(--mut); }
.pfin-left { display:inline-flex; align-items:center; gap:7px; }
.pfin-rk { color:var(--mut); width:16px; }
.rules { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
.pbar { height:8px; background:var(--panel2); border:1px solid var(--line); border-radius:999px; overflow:hidden; }
.pfill { height:100%; background:var(--lime); border-radius:999px; transition:width .3s; }
.ptxt { display:block; font-size:12px; color:var(--mut); margin:6px 0 0; }
.rtxt { font-size:12px; color:var(--mut); margin:10px 0 0; line-height:1.5; }
.foot { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:18px; padding-top:14px; border-top:1px solid var(--line); flex-wrap:wrap; }
.fnote { font-size:12px; color:var(--mut); }
.orgbtn { border:1px solid var(--line); background:transparent; color:var(--mut); font-size:12px; padding:7px 12px; border-radius:9px; cursor:pointer; }
.orgbtn:active { border-color:var(--lime); color:var(--lime); }
.reset { border:1px solid var(--line); background:transparent; color:var(--mut); font-size:12px; padding:7px 12px; border-radius:9px; cursor:pointer; }
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px;}
.claim-grid{grid-template-columns:1fr;}
.schip{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.05);min-width:0;}
.schip .sn{font-size:15px;font-weight:700;line-height:1.15;}
.schip .sh{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.schip.vac{background:transparent;border:1px dashed var(--line);}
.schip.vac .sn{color:var(--mut);font-weight:700;}
.ava.vac{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:transparent;border:1px dashed #55606e;color:#55606e;font-size:22px;font-weight:400;flex:none;}
.schip.vac[data-act]{cursor:pointer;}
.schip.vac[data-act]:active{background:rgba(198,244,50,.08);border-color:var(--lime);}
.teamwrap{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px;}
.teambox{border:1px solid var(--line);border-radius:14px;padding:9px;background:rgba(255,255,255,.02);}
.tlabel{font-family:var(--disp,inherit);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lime);margin:0 2px 7px;}
.tslots{display:flex;flex-direction:column;gap:7px;}
@media(max-width:520px){.teamwrap{grid-template-columns:1fr;}}
.schip.pend{background:rgba(255,255,255,.03);border:1px solid var(--line);}
.schip.pend .sn{color:var(--mut);}
.pendtag{flex:none;font-size:11px;font-weight:800;color:#F4C542;background:rgba(244,197,66,.12);border:1px solid rgba(244,197,66,.3);padding:3px 9px;border-radius:999px;letter-spacing:.03em;}
.pend-x{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:16px;line-height:1;cursor:pointer;padding:0;}
.pend-x:active{background:rgba(255,107,107,.15);border-color:#FF6B6B;color:#FF6B6B;}
.pend-ok{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--lime);background:transparent;color:var(--lime);font-size:14px;line-height:1;cursor:pointer;padding:0;margin-right:5px;font-weight:800;}
.pend-ok:active{background:var(--lime);color:#0E1116;}
.ava.gray img{filter:grayscale(1);} .ava.gray{filter:grayscale(1);opacity:.85;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,92vw);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;z-index:50;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.m-h{font-family:'Anton',Impact,sans-serif;font-size:26px;color:var(--ink);line-height:1.05;}
.m-sub{font-size:13px;color:var(--mut);margin-top:4px;}
.m-lab{display:block;font-size:12px;color:var(--mut);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em;}
.m-in{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:17px;padding:13px 14px;outline:none;}
.m-in:focus{border-color:var(--lime);}
.m-note{font-size:14px;color:var(--ink);line-height:1.5;margin:12px 0 4px;}

.m-num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--lime);color:#0E1116;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
.m-row{display:flex;gap:10px;margin-top:20px;}
.m-btn{flex:1;border:0;border-radius:12px;background:var(--lime);color:#0E1116;font-weight:800;font-size:15px;padding:14px;cursor:pointer;}
.m-btn.ghost{background:var(--panel2);color:var(--ink);}
.m-btn.venmo{width:100%;background:#3D95CE;color:#fff;margin-top:10px;}
.m-btn:active{filter:brightness(.93);}
.srain{font-size:12px;color:var(--mut);margin:0 0 2px;}
.spill{font-size:13px;font-weight:700;letter-spacing:1px;padding:5px 12px;border-radius:999px;border:2px solid var(--lime);color:var(--lime);}
.spill.full{background:var(--ink);color:#0E1116;border-color:var(--ink);}
.brow.sea{grid-template-columns:22px 1fr 42px 28px 30px 26px 42px 46px;}
.brow.sea .st{font-size:13px;}
.brow.sea .st.w{font-size:18px;}
.brow.sea .n1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media (prefers-reduced-motion: reduce){ * { animation:none!important; transition:none!important; } }
.claim-results{margin-top:10px;max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.claim-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #262b33;border-radius:12px;background:#161a20;cursor:pointer}
.claim-opt:active{background:#1f252e}
.claim-opt.new{border-style:dashed;border-color:#3a414b}
.claim-none{color:#8891a0;font-size:13px;padding:10px 2px}
.segwrap{display:flex;gap:6px;background:#161a20;border:1px solid #262b33;border-radius:999px;padding:4px;margin-bottom:12px}
.seg{flex:1;border:0;background:transparent;color:#8891a0;font:800 14px system-ui;padding:9px 6px;border-radius:999px;cursor:pointer}
.seg.on{background:var(--lime);color:#0E1116}
.provhdr{color:#8891a0;font:800 11px system-ui;letter-spacing:1.3px;text-transform:uppercase;margin:16px 2px 8px}
.brow.sea.prov{opacity:.6}
.court.photo{position:relative}
.photo-del{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(14,17,22,.72);color:#fff;font-size:18px;line-height:1;cursor:pointer;z-index:3}
.addphoto{display:block;width:100%;margin-bottom:12px}
.herowrap{margin:0 0 14px}
.hero{position:relative;width:100%;aspect-ratio:4/5;max-height:430px;border-radius:16px;overflow:hidden;background:#0b0e12;cursor:pointer}
.hero-layer{position:absolute;inset:0;transition:opacity .8s ease}

.hero-pic{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}

.hero-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,17,22,.72),rgba(14,17,22,0) 38%);pointer-events:none}
.hero-tag{position:absolute;top:10px;left:12px;background:var(--lime);color:#0E1116;font-weight:800;font-size:11px;letter-spacing:1.5px;padding:4px 9px;border-radius:999px;pointer-events:none}
.hero-cap{position:absolute;left:12px;right:70px;bottom:16px;color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.hero-dots{position:absolute;right:12px;bottom:12px;display:flex;gap:5px;pointer-events:none}
.hero-dots .hd{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.hero-dots .hd.on{background:#fff}
.hero-rail{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 2px;-webkit-overflow-scrolling:touch}

function hkey(h){ return (h||"").toLowerCase().replace(/^@+/,"").replace(/\s+/g,"").trim(); }
function photoForHandle(h){ var k=hkey(h); if(!k) return null;
  for(var n in PLAYERS){ var _pp=PLAYERS[n]; if(hkey(_pp.handle)===k || (_pp.alts&&_pp.alts.some(function(a){return hkey(a)===k;}))) return {name:n, photo:PHOTOS[n]||null}; }
  // also scan the weekly rosters, which carry handle + name + photo key for everyone else
  var days=(SCHEDULE_WEEK&&SCHEDULE_WEEK.days)||[];
  for(var d=0; d<days.length; d++){ var pls=days[d].players||[];
    for(var i=0;i<pls.length;i++){ var p=pls[i]; if(p&&p.h&&hkey(p.h)===k) return {name:p.n, photo:PHOTOS[p.p||p.n]||null}; } }
  return null; }
// Resolve a photo from a display name even when the photo key differs (e.g. "Jay Money" -> "JayMoney").
function photoForName(name){
  if(!name) return null;
  if(PHOTOS[name]) return PHOTOS[name];
  var ns=String(name).replace(/\s+/g,""); if(PHOTOS[ns]) return PHOTOS[ns];
  var days=(SCHEDULE_WEEK&&SCHEDULE_WEEK.days)||[];
  for(var d=0; d<days.length; d++){ var pls=days[d].players||[];
    for(var i=0;i<pls.length;i++){ var p=pls[i];
      if(p&&p.n&&hkey(p.n)===hkey(name)){ var ph=PHOTOS[p.p||p.n]; if(ph) return ph; if(p.h){ var pf=photoForHandle(p.h); if(pf&&pf.photo) return pf.photo; } } } }
  return null; }

  dbGetKey("season").then(function(s){
    if(s && s.length){ SEASON=s; SEASON_OK=true; } // keep live standings; NEVER overwrite the DB from a failed/empty read
    done();

    if(hh && hh.length){ HISTORY=hh; HIST_OK=true; } else { HISTORY=HISTORY_BASELINE.slice(); } applyHistoryFixes(); // fall back in memory only; do not persist

function allGamesDone(){ return SCHEDULE.length>0 && SCHEDULE.every(function(rd){ return isDone(state[gid(rd.r,1)]); }); }
function sessionWinners(rows){
  if(!rows.length) return [];
  var t=rows[0], w=[t];
  for(var i=1;i<rows.length;i++){ if(rows[i].w===t.w && rows[i].diff===t.diff) w.push(rows[i]); else break; }

function uploadNight(){

  if(!SEASON_OK || !HIST_OK){ alert("Standings are still syncing from the server. Give it a few seconds and try again so nothing gets overwritten."); return; }
  if(!allGamesDone()){ alert("Log every game first. The upload saves the whole night at once."); return; }
  if(!confirm("Upload tonight's scores and add them to the season standings?")) return;
  if(HISTORY.some(function(h){return h.date===SESSION.date && h.loc===SESSION.loc;})){
    if(!confirm("This night looks like it was already uploaded. Upload again anyway? (this will double-count it)")) return;
  }
  if(!confirm("Final check: save "+SESSION.label+" at "+SESSION.loc+" on "+fmtDate(SESSION.date)+" and clear the scoreboard for the next night?")) return;
  var rows=standings(), winners=sessionWinners(rows);
  var ftm=finalTeams(), tf=isTeamRR()?teamFinalTeams():null;
  var games=[]; SCHEDULE.forEach(function(rd){ var g=state[gid(rd.r,1)]; if(!isDone(g)) return;
    var A=rd.courts[0][0], B=rd.courts[0][1];
    // store the real finale teams, never the ?/? placeholder
    if(rd.final){ if(tf){ var pr=(rd.fkind==='champ')?tf.champ:tf.third; A=pr[0]; B=pr[1]; } else if(ftm){ A=ftm[0]; B=ftm[1]; } }
    games.push({a:A,b:B,sa:g.a,sb:g.b,fin:!!rd.final}); });
  var entry={date:SESSION.date,loc:SESSION.loc,label:SESSION.label,
    winners:winners.map(function(r){return r.name;}),
    standings:rows.map(function(r){return {name:r.name,w:r.w,l:r.l,diff:r.diff};}),
    games:games, ts:Date.now()};
  var share=winners.length?1/winners.length:0;
  rows.forEach(function(r){
    var row=null,i; for(i=0;i<SEASON.length;i++){ if(SEASON[i].name===r.name){row=SEASON[i];break;} }
    if(!row){ row={name:r.name,color:(PLAYERS[r.name]&&PLAYERS[r.name].color)||"#8891a0",w:0,l:0,diff:0,sessions:0,nw:0}; SEASON.push(row); }

    if(winners.some(function(x){return x.name===r.name;})) row.nw=Math.round(((row.nw||0)+share)*10)/10;
  });
  HISTORY.push(entry);
  dbPutKey("season",SEASON); dbPutKey("history",HISTORY);
  state={}; dbReset();
  tab="season"; render(); updateCount();
  var who=winners.map(function(r){return r.name;}).join(" & ")||"nobody";
  alert("Saved. "+who+" took the night. Season standings updated and the night is in Past Games.");
}

// Fill in a finale game that was stored with "?" placeholder teams, by re-seeding the night's regular games.
function sessionFinaleTeams(games){
  var t={};
  function add(n){ if(!t[n]) t[n]={name:n,w:0,l:0,pf:0,pa:0}; }
  (games||[]).forEach(function(g){
    var A=g.a||[], B=g.b||[]; if(!A.length||!B.length) return;
    if((A.join("")+B.join("")).indexOf("?")>=0) return; // skip the finale / placeholder itself
    A.forEach(add); B.forEach(add); var aw=g.sa>g.sb;
    A.forEach(function(p){ t[p].pf+=g.sa; t[p].pa+=g.sb; aw?t[p].w++:t[p].l++; });
    B.forEach(function(p){ t[p].pf+=g.sb; t[p].pa+=g.sa; aw?t[p].l++:t[p].w++; });
  });
  var a=[]; for(var k in t){ t[k].diff=t[k].pf-t[k].pa; a.push(t[k]); }
  a.sort(function(x,y){return y.w-x.w||y.diff-x.diff||y.pf-x.pf||x.name.localeCompare(y.name);});
  if(a.length<4) return null;
  return [[a[0].name,a[3].name],[a[1].name,a[2].name]];
}
function resolveGames(s){
  var games=(s.games||[]); var ft=null;
  return games.map(function(g){
    var A=g.a||[], B=g.b||[], isPh=((A.join("")+B.join("")).indexOf("?")>=0);
    if(isPh){ if(!ft) ft=sessionFinaleTeams(games); if(ft) return {a:ft[0],b:ft[1],sa:g.sa,sb:g.sb,fin:true}; }
    return g;
  });
}

  }
  else if(act==="upload"){ uploadNight(); }
  else if(act==="pastToggle"){
    var k=t.getAttribute("data-k"); pastOpen[k]=!pastOpen[k];
    var body=t.parentNode.querySelector(".pbody"); var car=t.querySelector(".pcar");
    if(body) body.style.display=pastOpen[k]?'block':'none';
    if(car) car.innerHTML=pastOpen[k]?'&#9650;':'&#9660;';
  }
  else if(act==="step"){
    var id=t.getAttribute("data-id"), side=t.getAttribute("data-side"), d=parseInt(t.getAttribute("data-delta"),10);
    var g=state[id]||{a:0,b:0}, a=g.a||0, b=g.b||0;
    if(side==="a") a=clamp(a+d); else b=clamp(b+d);
    onScore(id,a,b);
  } else if(act==="reset"){
    if(!ORGANIZER) return;
    if(confirm("Clear all scores for everyone?")){ state={}; dbReset(); render(); updateCount(); }
  }
});
document.addEventListener("input",function(e){
  var t=e.target; if(!t.classList||!t.classList.contains("snum")) return;
  var id=t.getAttribute("data-id"), side=t.getAttribute("data-side");
  var v=t.value.replace(/[^0-9]/g,""); if(v.length>2) v=v.slice(0,2);
  if(v!==t.value) t.value=v;
  var n=clamp(parseInt(v||"0",10));
  var g=state[id]||{a:0,b:0}, a=g.a||0, b=g.b||0;
  if(side==="a") a=n; else b=n;
  onScore(id,a,b);
});
document.addEventListener("focus",function(e){
  var t=e.target; if(t.classList&&t.classList.contains("snum")) t.select();
},true);
document.addEventListener("blur",function(e){
  var t=e.target; if(!t.classList||!t.classList.contains("snum")) return;
  if(t.value===""||isNaN(parseInt(t.value,10))){
    var id=t.getAttribute("data-id"); var g=state[id]||{a:0,b:0};
    t.value=(t.getAttribute("data-side")==="a"?(g.a||0):(g.b||0));
  }
},true);
function setLive(){
  var el=document.getElementById("live");
  var b=document.getElementById("banner");
  if(DB){ el.classList.add("on"); b.innerHTML=""; }
  else { el.classList.remove("on");
    b.innerHTML='<div class="banner">Syncing is off, so scores stay on this device only. To sync across everyone\'s phones, open the link that ends with #db=... (see setup notes).</div>'; }
}
function poll(){
  dbGetKey("days").then(function(d){ var j=JSON.stringify(d||{}); if(j===_daysJson) return; CUSTOM_DAYS=d||{}; _daysJson=j; mergeDays(); rebuildActive(); if(tab==="schedule") renderSchedule(); });
  dbGetKey("banner").then(function(bb){ var j=JSON.stringify(bb||null); if(j===_bannerJson) return; CUSTOM_BANNER=(bb&&bb.headline)?bb:null; _bannerJson=j; if(tab==="schedule") renderSchedule(); });
  dbGetKey("gallery").then(function(gg){ var j=JSON.stringify(gg||{}); if(j===_galleryJson) return; CUSTOM_GALLERY=gg||{}; _galleryJson=j; if(tab==="schedule") renderSchedule(); else if(tab==="photos") renderPhotos(); });
  dbGetKey("photos").then(function(pp){ var j=JSON.stringify(pp||{}); if(j===_photosJson) return; CUSTOM_PHOTOS=pp||{}; _photosJson=j; mergeCustomPhotos(); render(); });
  dbGet().then(function(remote){
    if(!remote) return; var changed=false;
    for(var id in remote){ var rt=(remote[id]&&remote[id].ts)||0, lt=(state[id]&&state[id].ts)||0;
      if(rt>lt){ state[id]=remote[id]; changed=true; } }
    if(changed){ if(tab==="games"){ for(var id in state) updateCard(id); refreshFinale(); updateUploadBtn(); } else if(tab==="standings"){ renderStandings(); } updateCount(); }
  });
  if(tab==="schedule"||tab==="standings"||tab==="games"){
    dbGetKey("signups").then(function(s){ var j=JSON.stringify(s||{}); if(j===_signupsJson) return; SIGNUPS=s||{}; _signupsJson=j;
      if(tab==="schedule") renderSchedule();
      else if(SESSION.state!=="ready") render(); // roster changed while we wait -> auto-refresh (fills PENDING into matchups)
    });
  }
}
setLive();
(function(){ var b=document.getElementById("orgBtn"); if(b) b.textContent=ORGANIZER?"Organizer ✓":"Organizer"; })();
loadSeasonHistory(function(){ render(); }); // re-render once history is in so activeDay can skip uploaded nights
loadSignups(function(){ if(tab==="schedule") renderSchedule(); });
loadDays(function(){ render(); });
loadBanner(function(){ if(tab==="schedule") renderSchedule(); });
loadGallery(function(){ if(tab==="schedule") renderSchedule(); else if(tab==="photos") renderPhotos(); });
loadPhotos(function(){ render(); });
dbGet().then(function(r){ if(r) state=r; render(); updateCount(); });
setInterval(poll,3500);
document.addEventListener("visibilitychange",function(){ if(!document.hidden) poll(); });
</script>
</body>
</html>
